// ElasticMQ queue topology — mirrors the CDK queue definitions in infra/.
// Every channel queue redrives to its own DLQ after 3 receives, matching
// maxReceiveCount in infra/lib/queues-stack.ts.
include classpath("application.conf")

node-address {
  protocol = http
  host = "localhost"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  pulse-email-dlq { }
  pulse-push-dlq { }
  pulse-sms-dlq { }
  pulse-webhook-dlq { }
  pulse-inapp-dlq { }

  pulse-email {
    deadLettersQueue { name = "pulse-email-dlq", maxReceiveCount = 3 }
    receiveMessageWait = 0s
  }
  pulse-push {
    deadLettersQueue { name = "pulse-push-dlq", maxReceiveCount = 3 }
    receiveMessageWait = 0s
  }
  pulse-sms {
    deadLettersQueue { name = "pulse-sms-dlq", maxReceiveCount = 3 }
    receiveMessageWait = 0s
  }
  pulse-webhook {
    deadLettersQueue { name = "pulse-webhook-dlq", maxReceiveCount = 3 }
    receiveMessageWait = 0s
  }
  pulse-inapp {
    deadLettersQueue { name = "pulse-inapp-dlq", maxReceiveCount = 3 }
    receiveMessageWait = 0s
  }
}
